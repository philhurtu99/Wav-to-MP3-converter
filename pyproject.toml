[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "wav-to-mp3-app"
version = "0.1.0"
description = "Drag-and-drop WAV to MP3 converter app with a cross-platform CLI"
requires-python = ">=3.11"
dependencies = [
    "PySide6>=6.7",
]

[project.scripts]
wav-to-mp3 = "wav_to_mp3.cli:main"
wav-to-mp3-gui = "wav_to_mp3.gui:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pyinstaller>=6.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["wav_to_mp3*"]
