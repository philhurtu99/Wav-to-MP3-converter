name: Build installers and CLI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    name: Tests on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install ffmpeg on Linux
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install ffmpeg on macOS
        if: runner.os == 'macOS'
        run: brew install ffmpeg
      - name: Install ffmpeg on Windows
        if: runner.os == 'Windows'
        run: choco install ffmpeg -y
      - name: Install package
        run: python -m pip install -U pip && python -m pip install -e ".[dev]"
      - name: Run tests
        run: pytest -q

  build-linux-cli:
    name: Build Linux CLI
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Build CLI
        run: |
          python -m pip install -U pip
          python -m pip install -e ".[dev]"
          pyinstaller --noconfirm packaging/pyinstaller-cli.spec
          mkdir -p release
          tar -C dist -czf release/wav-to-mp3-linux-x86_64.tar.gz wav-to-mp3
      - uses: actions/upload-artifact@v4
        with:
          name: wav-to-mp3-linux-cli
          path: release/wav-to-mp3-linux-x86_64.tar.gz

  build-macos-app:
    name: Build macOS app
    runs-on: macos-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install ffmpeg
        run: brew install ffmpeg
      - name: Build app and CLI
        run: |
          python -m pip install -U pip
          python -m pip install -e ".[dev]"
          pyinstaller --noconfirm packaging/pyinstaller-cli.spec
          pyinstaller --noconfirm packaging/pyinstaller-gui.spec
          mkdir -p release
          ditto -c -k --sequesterRsrc --keepParent "dist/Convertisseur WAV vers MP3.app" "release/Convertisseur-WAV-vers-MP3-macOS.zip"
          cp dist/wav-to-mp3 release/wav-to-mp3-macos
      - uses: actions/upload-artifact@v4
        with:
          name: wav-to-mp3-macos
          path: |
            release/Convertisseur-WAV-vers-MP3-macOS.zip
            release/wav-to-mp3-macos

  build-windows-app:
    name: Build Windows app
    runs-on: windows-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install ffmpeg
        run: choco install ffmpeg -y
      - name: Build app and CLI
        shell: pwsh
        run: .\scripts\build-windows.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: wav-to-mp3-windows
          path: |
            release/Convertisseur-WAV-vers-MP3-Windows.zip
            release/wav-to-mp3-windows.exe

  release:
    name: Publish GitHub release assets
    runs-on: ubuntu-latest
    needs: [build-linux-cli, build-macos-app, build-windows-app]
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          generate_release_notes: true
